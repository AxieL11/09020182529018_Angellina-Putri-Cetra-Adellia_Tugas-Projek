<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - KyaaaStore</title>
  <link rel="stylesheet" href="Login.css">
</head>

<body>

  <div class="login-box">
    <img src="https://png.pngtree.com/png-clipart/20250206/original/pngtree-cute-pink-ribbon-simple-png-image_19805755.png" alt="Logo KyaaaStore" class="logo">
    <h2>Login</h2>

    <input type="text" id="username" placeholder="Masukkan Username">
    <p class="error" id="error-text">Username tidak boleh kosong!</p>

    <button onclick="login()">Masuk</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
